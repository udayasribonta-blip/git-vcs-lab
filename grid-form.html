<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Form | ShopEase</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      color: #243047;
      background: #f5f7fc;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 30px;
      border: 1px solid #e1e6f0;
      border-radius: 14px;
      background: white;
      box-shadow: 0 5px 16px rgb(32 43 67 / 7%);
    }

    h1 {
      margin-top: 0;
      color: #2155cd;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 22px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #bfc8d8;
      border-radius: 7px;
      font: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 7px;
      color: white;
      background: #2155cd;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full-width {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Customer Application Form</h1>
    <p>Enter your details below.</p>

    <form class="form-grid" action="#" method="get">
      <div class="field">
        <label for="first-name">First name</label>
        <input id="first-name" name="firstName" type="text" required>
      </div>

      <div class="field">
        <label for="last-name">Last name</label>
        <input id="last-name" name="lastName" type="text" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" pattern="[0-9]{10}" required>
      </div>

      <div class="field">
        <label for="city">City</label>
        <input id="city" name="city" type="text" required>
      </div>

      <div class="field">
        <label for="interest">Area of interest</label>
        <select id="interest" name="interest" required>
          <option value="">Choose one</option>
          <option value="electronics">Electronics</option>
          <option value="travel">Travel accessories</option>
          <option value="home">Home products</option>
        </select>
      </div>

      <div class="field full-width">
        <label for="message">Additional details</label>
        <textarea id="message" name="message"></textarea>
      </div>

      <div class="field full-width">
        <button type="submit">Submit Application</button>
      </div>
    </form>
  </main>
</body>
</html>
