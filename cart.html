<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopEase product catalog and demo shopping cart">
  <title>ShopEase | Shopping Cart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #243047;
      background: #f5f7fc;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px 7%;
      background: white;
      border-bottom: 1px solid #e1e6f0;
    }

    .header-content {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      margin: 0;
      color: #2155cd;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    nav a {
      color: #243047;
      font-weight: bold;
      text-decoration: none;
    }

    nav a:hover {
      color: #2155cd;
    }

    main {
      max-width: 1100px;
      margin: 34px auto;
      padding: 0 20px;
    }

    .intro {
      margin-bottom: 28px;
      padding: 30px;
      border-radius: 16px;
      color: white;
      background: linear-gradient(120deg, #214fc5, #718cf0);
    }

    .intro h2 {
      margin-top: 0;
    }

    .shop-layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
      align-items: start;
      gap: 24px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .product-card,
    .cart-panel {
      border: 1px solid #e1e6f0;
      border-radius: 13px;
      background: white;
      box-shadow: 0 5px 16px rgb(32 43 67 / 6%);
    }

    .product-card {
      overflow: hidden;
    }

    .product-icon {
      min-height: 130px;
      display: grid;
      place-items: center;
      background: #eaf0ff;
      font-size: 58px;
    }

    .product-info {
      padding: 17px;
    }

    .product-info h3 {
      margin-top: 0;
    }

    .price {
      color: #2155cd;
      font-size: 18px;
      font-weight: bold;
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 7px;
      color: white;
      background: #2155cd;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #173fa1;
    }

    .cart-panel {
      padding: 20px;
    }

    .cart-panel h2 {
      margin-top: 0;
    }

    .cart-item {
      padding: 14px 0;
      border-bottom: 1px solid #e1e6f0;
    }

    .cart-item h3 {
      margin: 0 0 7px;
      font-size: 17px;
    }

    .cart-item p {
      margin: 5px 0;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .quantity-controls button {
      padding: 5px 10px;
    }

    .remove-button {
      margin-top: 10px;
      background: #b42318;
    }

    .remove-button:hover {
      background: #8f1c13;
    }

    .cart-total {
      margin: 18px 0;
      font-size: 20px;
      font-weight: bold;
    }

    .empty-message {
      color: #5c6679;
    }

    footer {
      margin-top: 45px;
      padding: 22px;
      color: white;
      background: #202b43;
      text-align: center;
    }

    @media (max-width: 800px) {
      .shop-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 550px) {
      .header-content {
        align-items: flex-start;
        flex-direction: column;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-content">
      <h1 class="brand">ShopEase</h1>

      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="products.html">Catalog</a>
        <a href="auth.html">Login / Register</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="intro">
      <h2>Shop our products</h2>
      <p>Add products to your cart and see the total update.</p>
    </section>

    <div class="shop-layout">
      <section aria-labelledby="products-heading">
        <h2 id="products-heading">Available Products</h2>
        <div class="products-grid" id="products-list"></div>
      </section>

      <aside class="cart-panel" aria-labelledby="cart-heading">
        <h2 id="cart-heading">Your Cart</h2>
        <div id="cart-items">
          <p class="empty-message">Your cart is empty.</p>
        </div>
        <p class="cart-total" id="cart-total">Total: ₹0</p>
        <button id="checkout-button" type="button">Checkout demo</button>
        <p id="checkout-message" aria-live="polite"></p>
      </aside>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 ShopEase. Demo shopping cart.</p>
  </footer>

  <script>
    // Product data is stored in an array of objects.
    const products = [
      { id: 1, name: "Wireless Headphones", price: 1999, icon: "🎧" },
      { id: 2, name: "Smart Watch", price: 2999, icon: "⌚" },
      { id: 3, name: "Travel Backpack", price: 899, icon: "🎒" },
      { id: 4, name: "Digital Camera", price: 8499, icon: "📷" },
      { id: 5, name: "Bluetooth Speaker", price: 1499, icon: "🔊" },
      { id: 6, name: "Running Shoes", price: 2199, icon: "👟" }
    ];

    // Cart entries store a product ID and quantity.
    const cart = [];

    const productsList = document.getElementById("products-list");
    const cartItems = document.getElementById("cart-items");
    const cartTotal = document.getElementById("cart-total");
    const checkoutMessage = document.getElementById("checkout-message");

    function formatPrice(amount) {
      return "₹" + amount.toLocaleString("en-IN");
    }

    function displayProducts() {
      productsList.innerHTML = products.map(function (product) {
        return `
          <article class="product-card">
            <div class="product-icon" role="img" aria-label="${product.name}">
              ${product.icon}
            </div>
            <div class="product-info">
              <h3>${product.name}</h3>
              <p class="price">${formatPrice(product.price)}</p>
              <button type="button" data-add="${product.id}">
                Add to cart
              </button>
            </div>
          </article>
        `;
      }).join("");
    }

    function displayCart() {
      if (cart.length === 0) {
        cartItems.innerHTML = '<p class="empty-message">Your cart is empty.</p>';
        cartTotal.textContent = "Total: ₹0";
        return;
      }

      let total = 0;

      cartItems.innerHTML = cart.map(function (cartItem) {
        const product = products.find(function (item) {
          return item.id === cartItem.id;
        });

        const itemTotal = product.price * cartItem.quantity;
        total += itemTotal;

        return `
          <div class="cart-item">
            <h3>${product.name}</h3>
            <p>${formatPrice(product.price)} each</p>
            <p>Subtotal: ${formatPrice(itemTotal)}</p>
            <div class="quantity-controls">
              <button type="button" data-decrease="${product.id}" aria-label="Decrease quantity">−</button>
              <span>Quantity: ${cartItem.quantity}</span>
              <button type="button" data-increase="${product.id}" aria-label="Increase quantity">+</button>
            </div>
            <button class="remove-button" type="button" data-remove="${product.id}">
              Remove
            </button>
          </div>
        `;
      }).join("");

      cartTotal.textContent = "Total: " + formatPrice(total);
    }

    productsList.addEventListener("click", function (event) {
      const productId = Number(event.target.dataset.add);

      if (!productId) {
        return;
      }

      const existingItem = cart.find(function (item) {
        return item.id === productId;
      });

      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({ id: productId, quantity: 1 });
      }

      checkoutMessage.textContent = "";
      displayCart();
    });

    cartItems.addEventListener("click", function (event) {
      const increaseId = Number(event.target.dataset.increase);
      const decreaseId = Number(event.target.dataset.decrease);
      const removeId = Number(event.target.dataset.remove);

      if (increaseId) {
        const item = cart.find(function (entry) {
          return entry.id === increaseId;
        });
        item.quantity += 1;
      }

      if (decreaseId) {
        const item = cart.find(function (entry) {
          return entry.id === decreaseId;
        });

        item.quantity -= 1;

        if (item.quantity < 1) {
          const itemIndex = cart.findIndex(function (entry) {
            return entry.id === decreaseId;
          });
          cart.splice(itemIndex, 1);
        }
      }

      if (removeId) {
        const itemIndex = cart.findIndex(function (entry) {
          return entry.id === removeId;
        });
        cart.splice(itemIndex, 1);
      }

      displayCart();
    });

    document.getElementById("checkout-button").addEventListener("click", function () {
      if (cart.length === 0) {
        checkoutMessage.textContent = "Add a product before checkout.";
      } else {
        checkoutMessage.textContent =
          "Demo checkout only. No order or payment was processed.";
      }
    });

    displayProducts();
    displayCart();
  </script>
</body>
</html>
