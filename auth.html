<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login and Registration | ShopEase</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #243047;
      background: #f5f7fc;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px 7%;
      background: white;
      border-bottom: 1px solid #e1e6f0;
    }

    .header-content {
      max-width: 1000px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      margin: 0;
      color: #2155cd;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    nav a {
      color: #243047;
      font-weight: bold;
      text-decoration: none;
    }

    main {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 18px;
    }

    .card {
      padding: 28px;
      border: 1px solid #e1e6f0;
      border-radius: 15px;
      background: white;
      box-shadow: 0 5px 16px rgb(32 43 67 / 7%);
    }

    h2 {
      color: #2155cd;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin: 22px 0;
    }

    .tabs button,
    .submit-button {
      padding: 12px;
      border: 1px solid #2155cd;
      border-radius: 8px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .tabs button {
      flex: 1;
      color: #2155cd;
      background: white;
    }

    .tabs button.active,
    .submit-button {
      color: white;
      background: #2155cd;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #bfc8d8;
      border-radius: 8px;
      font: inherit;
    }

    input:focus {
      outline: 3px solid #cbd7ff;
      border-color: #2155cd;
    }

    .hint {
      margin: 6px 0 0;
      color: #5c6679;
      font-size: 14px;
    }

    .submit-button {
      width: 100%;
    }

    .message {
      min-height: 24px;
      font-weight: bold;
    }

    .success {
      color: #16733b;
    }

    .error {
      color: #b42318;
    }

    .hidden {
      display: none;
    }

    footer {
      padding: 22px;
      color: white;
      background: #202b43;
      text-align: center;
    }

    @media (max-width: 600px) {
      .header-content {
        align-items: flex-start;
        flex-direction: column;
      }

      .card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-content">
      <h1 class="brand">ShopEase</h1>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="products.html">Catalog</a>
        <a href="forms.html">Checkout</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="card" aria-labelledby="page-title">
      <h2 id="page-title">Welcome to ShopEase</h2>
      <p>Register for a demo account or try the login form.</p>

      <div class="tabs">
        <button class="active" id="register-tab" type="button">Register</button>
        <button id="login-tab" type="button">Login</button>
      </div>

      <form id="register-form">
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" minlength="2" required>
        </div>

        <div class="field">
          <label for="register-email">Email address</label>
          <input id="register-email" name="email" type="email" required>
        </div>

        <div class="field">
          <label for="register-password">Password</label>
          <input id="register-password" name="password" type="password" minlength="8" required>
          <p class="hint">Use at least 8 characters.</p>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" name="confirmPassword" type="password" minlength="8" required>
        </div>

        <button class="submit-button" type="submit">Create demo account</button>
        <p class="message" id="register-message" aria-live="polite"></p>
      </form>

      <form id="login-form" class="hidden">
        <div class="field">
          <label for="login-email">Email address</label>
          <input id="login-email" name="email" type="email" required>
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" minlength="8" required>
        </div>

        <button class="submit-button" type="submit">Login demo</button>
        <p class="message" id="login-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 ShopEase</p>
  </footer>

  <script>
    const registerForm = document.getElementById("register-form");
    const loginForm = document.getElementById("login-form");
    const registerTab = document.getElementById("register-tab");
    const loginTab = document.getElementById("login-tab");

    registerTab.addEventListener("click", function () {
      registerForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
      registerTab.classList.add("active");
      loginTab.classList.remove("active");
    });

    loginTab.addEventListener("click", function () {
      loginForm.classList.remove("hidden");
      registerForm.classList.add("hidden");
      loginTab.classList.add("active");
      registerTab.classList.remove("active");
    });

    registerForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const password = document.getElementById("register-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      const message = document.getElementById("register-message");

      message.className = "message";

      if (password !== confirmPassword) {
        message.textContent = "The passwords do not match.";
        message.classList.add("error");
        return;
      }

      message.textContent = "Registration details are valid. This is a frontend demo.";
      message.classList.add("success");
      registerForm.reset();
    });

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const message = document.getElementById("login-message");
      message.textContent = "Login form is valid. Real authentication needs a backend.";
      message.className = "message success";
      loginForm.reset();
    });
  </script>
</body>
</html>
